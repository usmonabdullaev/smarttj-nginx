resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name smarttj.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smarttj.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/smarttj.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarttj.duckdns.org/privkey.pem;

    set $backend http://backend:3001;

    location / {
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
