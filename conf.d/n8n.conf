server {
    listen 80;
    server_name smarttj-n8n.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name smarttj-n8n.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/smarttj-n8n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarttj-n8n.duckdns.org/privkey.pem;

    set $n8n http://n8n:5678;

    location / {
        proxy_pass $n8n;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}