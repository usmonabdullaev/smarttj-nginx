location /realtime/ {
    set $realtime http://realtime:3000;

    # Отрезаем /realtime, чтобы в контейнер ушло /socket.io/... или /...
    rewrite ^/realtime/(.*) /$1 break;
    proxy_pass $realtime;

    proxy_http_version 1.1;

    # Корректные заголовки для WebSockets и Long Polling
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Таймауты для долгоживущих сокетов (чтобы не рвались каждые 5 мин)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    proxy_buffering off;
}