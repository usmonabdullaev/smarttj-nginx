services:
  nginx:
    image: nginx:alpine
    container_name: smarttj-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro

      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    networks:
      - smarttj-network

networks:
  smarttj-network:
    external: true
